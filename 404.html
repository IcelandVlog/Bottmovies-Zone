<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found - Bottmovies Zone</title>
<link rel="shortcut icon" href="favicon.png" type="image/x-icon"/>
<style>
  :root { --bg:#07090d; --card:rgba(17,20,28,.86); --border:#222a3a; --text:#f1f5f9; --muted:#94a3b8; --accent:#7ed321; --accent2:#e11d48; --glow:rgba(126,211,33,.18); }
  :root[data-theme="light"] { --bg:#eef1f6; --card:rgba(255,255,255,.92); --border:#dde2ea; --text:#14161c; --muted:#5b6474; --accent:#4d9a12; --accent2:#e11d48; --glow:rgba(77,154,18,.14); }
  :root[data-theme="dark"] { --bg:#07090d; --card:rgba(17,20,28,.86); --border:#222a3a; --text:#f1f5f9; --muted:#94a3b8; --accent:#7ed321; --accent2:#e11d48; --glow:rgba(126,211,33,.18); }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin:0; color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, var(--glow), transparent 60%), var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px; overflow:hidden;
  }
  /* Ghurte thaka film reel-er moto background dots */
  .reel { position:fixed; width:340px; height:340px; border-radius:50%; border:2px dashed var(--border); opacity:.5; animation: spin 40s linear infinite; }
  .reel.a { top:-120px; left:-120px; }
  .reel.b { bottom:-160px; right:-140px; animation-duration:60s; animation-direction:reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .box { position:relative; width:100%; max-width:480px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:34px 26px 28px; text-align:center; box-shadow: 0 20px 50px rgba(0,0,0,.35); backdrop-filter: blur(8px); }
  .logo { height:38px; width:auto; }
  .clap { display:inline-block; font-size:44px; margin:18px 0 4px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
  .code { font-size:64px; font-weight:900; letter-spacing:2px; line-height:1; margin:0 0 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { color:var(--muted); font-size:14px; line-height:1.55; margin:0 auto 22px; max-width:340px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:6px; padding:11px 20px; border-radius:10px; font-weight:700; font-size:14px; text-decoration:none; transition: transform .15s, filter .15s; }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .btn-primary { background: var(--accent); color:#0b0d12; }
  .btn-ghost { background: transparent; color: var(--text); border:1px solid var(--border); }
  .quick { margin-top:24px; padding-top:18px; border-top:1px dashed var(--border); display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .chip { font-size:12px; font-weight:700; padding:6px 12px; border-radius:999px; border:1px solid var(--border); color:var(--muted); text-decoration:none; }
  .chip:hover { color:var(--text); border-color: var(--accent); }
  @media (max-width: 480px) { .code { font-size:52px; } .box { padding:26px 18px 22px; } }
  @media (prefers-reduced-motion: reduce) { .reel, .clap { animation: none; } }
</style>
</head>
<body>
  <div class="reel a" aria-hidden="true"></div>
  <div class="reel b" aria-hidden="true"></div>
  <main class="box">
    <img class="logo" src="logo.png" alt="Bott Movies">
    <div class="clap" aria-hidden="true">🎬</div>
    <div class="code">404</div>
    <h1>This page could not be found</h1>
    <p>The link may be wrong, or the movie/series has been removed. Go back to Home and browse again.</p>
    <div class="actions">
      <a class="btn btn-primary" href="/">🏠 Go to Home</a>
      <a class="btn btn-ghost" href="/#search">🔍 Search</a>
    </div>
    <div class="quick">
      <a class="chip" href="/">Movies</a>
      <a class="chip" href="/">Web Series</a>
      <a class="chip" href="/">Anime</a>
    </div>
  </main>
  <script>
    // Site-er theme (light/dark) je thik kora chhilo, shei onujayi dekhabe
    (function () {
      try {
        var t = localStorage.getItem('bottmovies_theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</body>
</html>
