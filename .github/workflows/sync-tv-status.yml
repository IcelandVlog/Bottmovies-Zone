name: Sync TV ongoing status

on:
  schedule:
    - cron: '0 */6 * * *'   # protibar 6 ghonta por TMDB theke check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync tvStatus to Supabase
        run: node scripts/sync-tv-status.js
