name: Build IMDb lists

on:
  schedule:
    - cron: '30 3 * * *'   # roj UTC 03:30 (Dhaka 09:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download IMDb datasets
        run: |
          mkdir -p IMDB
          curl -fsSL -o IMDB/title.basics.tsv.gz https://datasets.imdbws.com/title.basics.tsv.gz
          curl -fsSL -o IMDB/title.ratings.tsv.gz https://datasets.imdbws.com/title.ratings.tsv.gz

      - name: Build imdb-lists.json
        run: node scripts/build-imdb-lists.js IMDB

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add imdb-lists.json
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update IMDb lists"
            git push
          fi
