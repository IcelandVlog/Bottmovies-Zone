<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player - Server Select</title>
  <style>
    body {
      margin: 0;
      background: #0b0d12;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .wrap {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }
    .server-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .server-buttons span {
      font-size: 12px;
      letter-spacing: 1px;
      color: #8a94a6;
      margin-right: 6px;
    }
    .server-buttons button {
      background: #1a1e27;
      color: #fff;
      border: 1px solid #2c3240;
      border-radius: 999px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .server-buttons button.active {
      background: #9be33a;
      color: #0b0d12;
      border-color: #9be33a;
    }
    .server-buttons p {
      margin: 0;
      font-size: 12px;
      color: #8a94a6;
    }
    .player-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #111;
      border-radius: 10px;
      overflow: hidden;
    }
    .player-box iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #openNewTab {
      display: inline-block;
      margin-top: 14px;
      color: #9be33a;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="server-buttons">
      <span>SERVER</span>
      <button data-server="1">Server 01</button>
      <button data-server="2">Server 02</button>
      <button data-server="3">Server 03</button>
      <p>Video not working? Try another server.</p>
    </div>

    <div class="player-box">
      <iframe
        id="player"
        src=""
        referrerpolicy="no-referrer"
        allowfullscreen
        allow="autoplay; encrypted-media; picture-in-picture"
      ></iframe>
    </div>

    <a id="openNewTab" href="#" target="_blank" rel="noopener">
      Notun tab-e khulun
    </a>
  </div>

  <script>
    // Tomar server link gulo ekhane rakho
    const servers = {
      1: "SERVER_1_EMBED_URL",
      2: "SERVER_2_EMBED_URL",
      3: "https://embed.vidrift.net/embed/tv/280888/1/1?brandLogo=https%3A%2F%2Fbottmovies-zone.vercel.app%2Flogo.png"
    };

    const player = document.getElementById("player");
    const openNewTab = document.getElementById("openNewTab");

    function setServer(num) {
      player.src = servers[num];
      openNewTab.href = servers[num];

      document.querySelectorAll("[data-server]").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.server == num);
      });
    }

    document.querySelectorAll("[data-server]").forEach(btn => {
      btn.addEventListener("click", () => setServer(btn.dataset.server));
    });

    // Page khulle default server
    setServer(1);
  </script>
</body>
</html>
